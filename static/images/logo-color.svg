<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="colorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 8-pointed modern rounded asterisk in vivid indigo-violet -->
  <g transform="translate(50, 50)">
    <!-- Vertical bar -->
    <rect x="-6" y="-42" width="12" height="84" rx="6" fill="url(#brandGrad)" />
    <!-- Horizontal bar -->
    <rect x="-42" y="-6" width="84" height="12" rx="6" fill="url(#brandGrad)" />
    <!-- Diagonal 1 (45 deg) -->
    <rect x="-6" y="-42" width="12" height="84" rx="6" fill="url(#brandGrad)" transform="rotate(45)" />
    <!-- Diagonal 2 (-45 deg) -->
    <rect x="-6" y="-42" width="12" height="84" rx="6" fill="url(#brandGrad)" transform="rotate(-45)" />
    <!-- Center core subtle glow -->
    <circle cx="0" cy="0" r="7.5" fill="#4338CA" />
  </g>
</svg>
