<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 8-pointed modern rounded asterisk / starburst -->
  <g transform="translate(50, 50)" filter="url(#softGlow)">
    <!-- Vertical bar -->
    <rect x="-6" y="-42" width="12" height="84" rx="6" fill="#FFFFFF" />
    <!-- Horizontal bar -->
    <rect x="-42" y="-6" width="84" height="12" rx="6" fill="#FFFFFF" />
    <!-- Diagonal 1 (45 deg) -->
    <rect x="-6" y="-42" width="12" height="84" rx="6" fill="#FFFFFF" transform="rotate(45)" />
    <!-- Diagonal 2 (-45 deg) -->
    <rect x="-6" y="-42" width="12" height="84" rx="6" fill="#FFFFFF" transform="rotate(-45)" />
    <!-- Center core subtle accent -->
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
  </g>
</svg>
