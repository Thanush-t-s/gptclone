{% extends "base.html" %}

{% block title %}Error - AI Chatbot{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="text-center">
        <i class="fas fa-exclamation-triangle text-5xl text-gray-300 mb-4"></i>
        <h1 class="text-4xl font-bold text-gray-900">500</h1>
        <p class="text-gray-600">Something went wrong on our end.</p>
        <p class="text-gray-500 mt-2">Please try again or start a new conversation.</p>
        <a href="{{ url_for('chat') }}" class="mt-6 px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-500 transition-colors">
            Return to chat
        </a>
    </div>
</div>
{% endblock %}
